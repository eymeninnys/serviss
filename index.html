<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Real Online Chat PRO</title>

<style>
body{
margin:0;
font-family:Arial;
background:radial-gradient(circle,#1a0033,#000);
color:white;
}

#loginScreen{
position:fixed;
inset:0;
background:black;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

.login-box{
background:rgba(255,255,255,0.1);
padding:25px;
border-radius:15px;
text-align:center;
}

input,textarea{
padding:10px;
margin:5px;
border:none;
border-radius:8px;
width:90%;
}

button{
padding:10px;
border:none;
border-radius:10px;
background:linear-gradient(45deg,#ff00cc,#3333ff);
color:white;
cursor:pointer;
margin:3px;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

.main{
display:grid;
grid-template-columns:1fr 2fr 1fr;
gap:10px;
}

.panel{
background:rgba(255,255,255,0.08);
padding:10px;
border-radius:10px;
height:80vh;
overflow:auto;
}

.msg{
background:rgba(0,0,0,0.3);
padding:5px;
margin:5px;
border-radius:8px;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">
<div class="login-box">
<h2>Giriş</h2>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Şifre">
<button onclick="login()">Giriş</button>
<button onclick="register()">Kayıt</button>
</div>
</div>

<!-- APP -->
<div id="app" style="display:none;">
<div class="container">

<h2>💬 REAL ONLINE CHAT</h2>
<button onclick="logout()">Çıkış</button>

<div class="main">

<!-- USERS -->
<div class="panel">
<h3>Kullanıcılar</h3>
<div id="users"></div>
</div>

<!-- CHAT -->
<div class="panel">
<h3>Chat</h3>
<div id="messages"></div>

<textarea id="msgInput"></textarea>
<button onclick="sendMessage()">Gönder</button>
</div>

<!-- STATUS -->
<div class="panel">
<h3>Online System</h3>
<div id="statusBox"></div>
</div>

</div>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
query,
orderBy,
onSnapshot,
serverTimestamp,
doc,
setDoc,
onDisconnect
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyCACA5gIRMDs67LUZ1QRG7GMNlxC44LsbE",
  authDomain: "servicess-59f58.firebaseapp.com",
  projectId: "servicess-59f58",
  storageBucket: "servicess-59f58.firebasestorage.app",
  messagingSenderId: "898248019243",
  appId: "1:898248019243:web:f57d0190e89df6b68ac96e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser=null;

/* LOGIN */
window.login=()=>signInWithEmailAndPassword(auth,email.value,password.value);
window.register=()=>createUserWithEmailAndPassword(auth,email.value,password.value);
window.logout=()=>signOut(auth);

/* REAL ONLINE SYSTEM */
function goOnline(user){

const ref = doc(db,"status",user.uid);

/* online */
setDoc(ref,{
email:user.email,
lastSeen:Date.now(),
state:"online"
});

/* offline when close */
onDisconnect(ref).set({
email:user.email,
lastSeen:Date.now(),
state:"offline"
});
}

/* HEARTBEAT */
setInterval(()=>{
if(currentUser){
setDoc(doc(db,"status",currentUser.uid),{
email:currentUser.email,
lastSeen:Date.now(),
state:"online"
});
}
},10000);

/* AUTH */
onAuthStateChanged(auth,(user)=>{
if(user){
currentUser=user;
loginScreen.style.display="none";
app.style.display="block";

goOnline(user);
loadAll();

}else{
loginScreen.style.display="flex";
app.style.display="none";
}
});

/* CHAT */
window.sendMessage=async()=>{
if(!msgInput.value) return;

await addDoc(collection(db,"messages"),{
text:msgInput.value,
user:currentUser.email,
time:serverTimestamp()
});

msgInput.value="";
}

/* LOAD CHAT */
function loadChat(){
const q=query(collection(db,"messages"),orderBy("time"));

onSnapshot(q,(snap)=>{
messages.innerHTML="";

snap.forEach(d=>{
let data=d.data();

messages.innerHTML+=`
<div class="msg">
<b>${data.user}</b><br>${data.text}
</div>`;
});
});
}

/* USERS */
function loadUsers(){
onSnapshot(collection(db,"status"),(snap)=>{
users.innerHTML="";
statusBox.innerHTML="";

snap.forEach(d=>{
let u=d.data();

let online = (Date.now()-u.lastSeen)<15000;

users.innerHTML+=`
<div>${online?"🟢":"🔴"} ${u.email}</div>
`;

statusBox.innerHTML+=`
<div>${u.email} - ${u.state}</div>
`;
});
});
}

/* INIT */
function loadAll(){
loadChat();
loadUsers();
}

</script>

</body>
</html>
