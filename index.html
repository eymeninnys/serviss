<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>NEON CHAT PRO</title>

<style>
body{
margin:0;
font-family:Arial;
background:radial-gradient(circle,#12002b,#000);
color:white;
}

#login{
position:fixed;inset:0;
display:flex;
justify-content:center;
align-items:center;
background:black;
}

.box{
background:rgba(255,255,255,0.08);
padding:20px;
border-radius:15px;
text-align:center;
width:300px;
}

input,textarea{
width:90%;
padding:10px;
margin:5px;
border-radius:8px;
border:none;
}

button{
padding:10px;
margin:5px;
border:none;
border-radius:10px;
background:linear-gradient(45deg,#ff00cc,#00d4ff);
color:white;
cursor:pointer;
}

#app{display:none;padding:15px;}

.container{
display:grid;
grid-template-columns:1fr 2fr 1fr;
gap:10px;
}

.panel{
background:rgba(255,255,255,0.05);
padding:10px;
border-radius:10px;
height:80vh;
overflow:auto;
}

.msg{
background:rgba(0,0,0,0.3);
padding:5px;
margin:5px;
border-radius:8px;
}

.online{color:#00ff88;}
.offline{color:#ff5555;}

#typing{
font-size:12px;
opacity:0.7;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
<div class="box">
<h2>NEON CHAT</h2>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Şifre">
<button onclick="login()">Giriş</button>
<button onclick="register()">Kayıt</button>
</div>
</div>

<!-- APP -->
<div id="app">

<h2>⚡ NEON CHAT PRO</h2>
<button onclick="logout()">Çıkış</button>

<div class="container">

<div class="panel">
<h3>Kullanıcılar</h3>
<div id="users"></div>
</div>

<div class="panel">
<h3>Chat</h3>
<div id="chat"></div>

<div id="typing"></div>

<textarea id="msg"></textarea>
<button onclick="send()">Gönder</button>
</div>

<div class="panel">
<h3>Panel</h3>
<div id="info"></div>
</div>

</div>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

const firebaseConfig = {
 apiKey:"AIzaSyCA5gGIRMDs67LUZ1QRG7GMNlxC44LsbE",
 authDomain:"servicess-59f58.firebaseapp.com",
 projectId:"servicess-59f58"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let currentUser=null;

/* AUTH */
function login(){
auth.signInWithEmailAndPassword(email.value,password.value)
.catch(e=>alert(e.message));
}

function register(){
auth.createUserWithEmailAndPassword(email.value,password.value)
.catch(e=>alert(e.message));
}

function logout(){auth.signOut();}

/* REAL ONLINE SYSTEM */
function setOnline(user){
db.collection("status").doc(user.uid).set({
email:user.email,
last:Date.now()
});
}

/* HEARTBEAT */
setInterval(()=>{
if(currentUser){
setOnline(currentUser);
}
},5000);

/* AUTH */
auth.onAuthStateChanged(user=>{
if(user){
currentUser=user;
login.style.display="none";
app.style.display="block";
setOnline(user);
loadAll();
}else{
login.style.display="flex";
app.style.display="none";
}
});

/* SEND */
function send(){
if(!msg.value) return;

db.collection("messages").add({
text:msg.value,
user:currentUser.email,
time:Date.now()
});

msg.value="";
}

/* CHAT */
function loadChat(){
db.collection("messages")
.orderBy("time")
.onSnapshot(snap=>{
chat.innerHTML="";
snap.forEach(d=>{
let x=d.data();
chat.innerHTML+=`
<div class="msg">
<b>${x.user}</b><br>${x.text}
</div>`;
});
});
}

/* USERS */
function loadUsers(){
db.collection("status")
.onSnapshot(snap=>{
users.innerHTML="";
info.innerHTML="";

snap.forEach(d=>{
let u=d.data();
let online=(Date.now()-u.last)<15000;

users.innerHTML+=`
<div class="${online?'online':'offline'}">
${online?'🟢':'🔴'} ${u.email}
</div>
`;

info.innerHTML+=`
<div>${u.email} - ${online?'ONLINE':'OFFLINE'}</div>
`;
});
});
}

/* TYPING SYSTEM (fake realtime) */
msg.addEventListener("input",()=>{
db.collection("typing").doc(currentUser.uid).set({
email:currentUser.email,
t:Date.now()
});
});

db.collection("typing").onSnapshot(snap=>{
typing.innerHTML="";
snap.forEach(d=>{
typing.innerHTML+=`${d.data().email} yazıyor...`;
});
});

/* INIT */
function loadAll(){
loadChat();
loadUsers();
}

</script>

</body>
</html>
