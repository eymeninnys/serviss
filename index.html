<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Mini Discord FIX</title>

<style>
body{
margin:0;
font-family:Arial;
background:radial-gradient(circle,#1a0033,#000);
color:white;
}

#loginScreen{
position:fixed;inset:0;
background:black;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

.login-box{
background:rgba(255,255,255,0.1);
padding:20px;
border-radius:10px;
text-align:center;
}

input,textarea{
padding:10px;
margin:5px;
border-radius:8px;
border:none;
width:90%;
}

button{
padding:10px;
border:none;
border-radius:10px;
background:linear-gradient(45deg,#ff00cc,#3333ff);
color:white;
cursor:pointer;
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

.main{
display:grid;
grid-template-columns:1fr 2fr 1fr;
gap:10px;
}

.panel{
background:rgba(255,255,255,0.08);
padding:10px;
border-radius:10px;
height:75vh;
overflow:auto;
}

.msg{
background:rgba(0,0,0,0.3);
padding:5px;
margin:5px;
border-radius:8px;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <h2>Giriş</h2>
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Şifre">
    <button onclick="login()">Giriş</button>
    <button onclick="register()">Kayıt</button>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none;">
<div class="container">

<h2>💬 CHAT SYSTEM</h2>
<button onclick="logout()">Çıkış</button>

<div class="main">

<div class="panel">
<h3>Kullanıcılar</h3>
<div id="users"></div>
</div>

<div class="panel">
<h3>Chat</h3>
<div id="messages"></div>

<textarea id="msgInput"></textarea>
<button onclick="sendMessage()">Gönder</button>
</div>

<div class="panel">
<h3>Panel</h3>
<div id="adminUsers"></div>
</div>

</div>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
query,
orderBy,
onSnapshot,
serverTimestamp,
doc,
setDoc,
deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyCA5gGIRMDs67LUZ1QrgS7GMNlxC44LsbE",
  authDomain: "servicess-59f58.firebaseapp.com",
  projectId: "servicess-59f58",
  storageBucket: "servicess-59f58.firebasestorage.app",
  messagingSenderId: "898248019243",
  appId: "1:898248019243:web:f57d0190e89df6b68ac96e"
};

const appFirebase = initializeApp(firebaseConfig);
const auth = getAuth(appFirebase);
const db = getFirestore(appFirebase);

/* ELEMENT SAFE */
const loginScreen = document.getElementById("loginScreen");
const appDiv = document.getElementById("app");

let currentUser=null;

/* LOGIN SAFE */
window.login=()=>{
signInWithEmailAndPassword(auth,email.value,password.value)
.catch(e=>alert(e.message));
}

window.register=()=>{
createUserWithEmailAndPassword(auth,email.value,password.value)
.catch(e=>alert(e.message));
}

window.logout=()=>signOut(auth);

/* ONLINE SAFE */
function setOnline(user){
if(!user) return;

setDoc(doc(db,"status",user.uid),{
email:user.email,
last:Date.now()
}).catch(()=>{});
}

function isOnline(last){
return (Date.now()-last)<30000;
}

/* AUTH SAFE */
onAuthStateChanged(auth,(user)=>{
try{
if(user){
currentUser=user;
loginScreen.style.display="none";
appDiv.style.display="block";
setOnline(user);
loadAll();
}else{
loginScreen.style.display="flex";
appDiv.style.display="none";
}
}catch(e){
console.log("AUTH ERROR:",e);
}
});

/* CHAT SAFE */
window.sendMessage=async()=>{
if(!msgInput.value || !currentUser) return;

await addDoc(collection(db,"messages"),{
text:msgInput.value,
user:currentUser.email,
time:serverTimestamp()
});

msgInput.value="";
}

/* CHAT LOAD SAFE */
function loadChat(){
const q=query(collection(db,"messages"),orderBy("time"));

onSnapshot(q,(snap)=>{
const box=document.getElementById("messages");
if(!box) return;

box.innerHTML="";

snap.forEach(d=>{
let data=d.data();

box.innerHTML+=`
<div class="msg">
<b>${data.user||"?"}</b><br>${data.text||""}
</div>`;
});
});
}

/* USERS SAFE */
function loadUsers(){
onSnapshot(collection(db,"status"),(snap)=>{
const box=document.getElementById("users");
const admin=document.getElementById("adminUsers");

if(!box) return;

box.innerHTML="";
admin.innerHTML="";

snap.forEach(d=>{
let data=d.data();
let online=isOnline(data.last);

box.innerHTML+=`<div>${online?"🟢":"🔴"} ${data.email}</div>`;

admin.innerHTML+=`
<div>
${data.email}
</div>`;
});
});
}

/* INIT SAFE */
function loadAll(){
try{
loadChat();
loadUsers();
}catch(e){
console.log("LOAD ERROR:",e);
}
}

</script>

</body>
</html>
