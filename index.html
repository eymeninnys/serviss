<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>UNIVERSAL CHAT PRO</title>

<style>
body{
margin:0;
font-family:Arial;
background:radial-gradient(circle,#1a0033,#000);
color:white;
}

#login{
position:fixed;inset:0;
background:black;
display:flex;
justify-content:center;
align-items:center;
}

.box{
background:rgba(255,255,255,0.1);
padding:20px;
border-radius:15px;
text-align:center;
}

input{
width:90%;
padding:10px;
margin:5px;
border-radius:8px;
border:none;
}

button{
width:90%;
padding:10px;
margin:5px;
border:none;
border-radius:10px;
background:linear-gradient(45deg,#ff00cc,#3333ff);
color:white;
}

#app{
display:none;
max-width:900px;
margin:auto;
padding:20px;
}

#chat{
height:400px;
overflow:auto;
background:rgba(0,0,0,0.3);
padding:10px;
border-radius:10px;
}

.msg{
margin:5px 0;
padding:5px;
background:rgba(255,255,255,0.1);
border-radius:8px;
}

</style>
</head>

<body>

<div id="login">
<div class="box">
<h2>Giriş</h2>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Şifre">
<button onclick="login()">Giriş</button>
<button onclick="register()">Kayıt</button>
</div>
</div>

<div id="app">

<h2>💬 UNIVERSAL CHAT</h2>
<button onclick="logout()">Çıkış</button>

<div id="chat"></div>

<input id="msg" placeholder="Mesaj yaz">
<button onclick="send()">Gönder</button>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyCA5gGIRMDs67LUZ1QRG7GMNlxC44LsbE",
  authDomain: "servicess-59f58.firebaseapp.com",
  projectId: "servicess-59f58",
  storageBucket: "servicess-59f58.firebasestorage.app",
  messagingSenderId: "898248019243",
  appId: "1:898248019243:web:f57d0190e89df6b68ac96e"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

/* LOGIN */
function login(){
auth.signInWithEmailAndPassword(email.value,password.value)
.catch(e=>alert(e.message));
}

function register(){
auth.createUserWithEmailAndPassword(email.value,password.value)
.catch(e=>alert(e.message));
}

function logout(){
auth.signOut();
}

/* AUTH */
auth.onAuthStateChanged(user=>{
if(user){
document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";
loadChat();
}else{
document.getElementById("login").style.display="flex";
document.getElementById("app").style.display="none";
}
});

/* SEND */
function send(){
let msg=document.getElementById("msg").value;
if(!msg) return;

db.collection("messages").add({
text:msg,
user:auth.currentUser.email,
time:Date.now()
});

document.getElementById("msg").value="";
}

/* LOAD */
function loadChat(){
db.collection("messages")
.orderBy("time")
.onSnapshot(snap=>{
let box=document.getElementById("chat");
box.innerHTML="";

snap.forEach(doc=>{
let d=doc.data();
box.innerHTML+=`
<div class="msg">
<b>${d.user}</b><br>${d.text}
</div>`;
});
});
}

</script>

</body>
</html>
