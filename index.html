<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Gizli Sistem CHAT PRO</title>

<style>
body{
margin:0;
font-family:Arial;
background:radial-gradient(circle,#1a0033,#000);
color:white;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

#loginScreen{
position:fixed;
inset:0;
background:black;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

.login-box{
background:rgba(255,255,255,0.1);
padding:25px;
border-radius:15px;
text-align:center;
}

input,textarea{
padding:10px;
margin:5px;
border-radius:8px;
border:none;
width:90%;
}

button{
padding:10px;
border:none;
border-radius:10px;
background:linear-gradient(45deg,#ff00cc,#3333ff);
color:white;
cursor:pointer;
margin:3px;
}

.main{
display:grid;
grid-template-columns:1fr 2fr;
gap:10px;
}

.panel{
background:rgba(255,255,255,0.08);
padding:10px;
border-radius:10px;
height:80vh;
overflow:auto;
}

.msg{
background:rgba(0,0,0,0.3);
padding:5px;
margin:5px;
border-radius:8px;
}

.small{
font-size:12px;
opacity:0.7;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">
<div class="login-box">
<h2>Giriş</h2>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Şifre">
<button onclick="login()">Giriş</button>
<button onclick="register()">Kayıt</button>
</div>
</div>

<!-- APP -->
<div id="app" style="display:none;">
<div class="container">

<h2>💬 MINI DISCORD SYSTEM</h2>

<button onclick="logout()">Çıkış</button>

<div class="main">

<!-- USER PANEL -->
<div class="panel">
<h3>Kullanıcılar</h3>
<div id="users"></div>
</div>

<!-- CHAT PANEL -->
<div class="panel">
<h3>Genel Chat</h3>
<div id="messages"></div>

<textarea id="msgInput" placeholder="Mesaj yaz"></textarea>
<button onclick="sendMessage()">Gönder</button>

<h3>DM</h3>
<input id="dmUser" placeholder="Kime (email)">
<textarea id="dmText"></textarea>
<button onclick="sendDM()">DM Gönder</button>

<div id="dmBox"></div>
</div>

</div>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
query,
orderBy,
onSnapshot,
serverTimestamp,
deleteDoc,
doc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCA5gGIRMDs67LUZ1QrgS7GMNlxC44LsbE",
  authDomain: "servicess-59f58.firebaseapp.com",
  projectId: "servicess-59f58",
  storageBucket: "servicess-59f58.firebasestorage.app",
  messagingSenderId: "898248019243",
  appId: "1:898248019243:web:f57d0190e89df6b68ac96e"
};

const appFirebase = initializeApp(firebaseConfig);
const auth = getAuth(appFirebase);
const db = getFirestore(appFirebase);

const loginScreen = document.getElementById("loginScreen");
const appDiv = document.getElementById("app");

let currentUser=null;

/* LOGIN */
window.login=()=>signInWithEmailAndPassword(auth,email.value,password.value);
window.register=()=>createUserWithEmailAndPassword(auth,email.value,password.value);
window.logout=()=>signOut(auth);

/* AUTH */
onAuthStateChanged(auth,(user)=>{
if(user){
currentUser=user;
loginScreen.style.display="none";
appDiv.style.display="block";
loadAll();
}else{
loginScreen.style.display="flex";
appDiv.style.display="none";
}
});

/* SEND MSG */
window.sendMessage=async()=>{
await addDoc(collection(db,"messages"),{
text:msgInput.value,
user:currentUser.email,
time:serverTimestamp()
});
msgInput.value="";
}

/* LOAD CHAT */
function loadChat(){
const q=query(collection(db,"messages"),orderBy("time"));

onSnapshot(q,(snap)=>{
messages.innerHTML="";
snap.forEach(d=>{
let data=d.data();

let div=document.createElement("div");
div.className="msg";
div.innerHTML=`
<b>${data.user}</b><br>
${data.text}<br>
<button onclick="deleteMsg('${d.id}','${data.user}')">Sil</button>
`;

messages.appendChild(div);
});
});
}

/* DELETE MSG */
window.deleteMsg=async(id,user)=>{
if(user!==currentUser.email) return;
await deleteDoc(doc(db,"messages",id));
}

/* USERS (fake online) */
function loadUsers(){
const q=query(collection(db,"messages"),orderBy("time"));

onSnapshot(q,(snap)=>{
let set=new Set();
snap.forEach(d=>set.add(d.data().user));

users.innerHTML="";
set.forEach(u=>{
users.innerHTML+=`<div>🟢 ${u}</div>`;
});
});
}

/* INIT */
function loadAll(){
loadChat();
loadUsers();
}

</script>

</body>
</html>
