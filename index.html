<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Gizli Dil Sistemi PRO</title>

<style>
body{
margin:0;
font-family:Arial;
background:radial-gradient(circle,#1a0033,#000);
color:white;
transition:0.4s;
}

body.light{
background:#f5f5f5;
color:black;
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

/* 🔐 LOGIN */
#loginScreen{
position:fixed;
inset:0;
background:rgba(0,0,0,0.95);
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

.login-box{
background:rgba(255,255,255,0.1);
padding:30px;
border-radius:15px;
text-align:center;
backdrop-filter:blur(10px);
}

.login-box input{
display:block;
margin:10px auto;
padding:10px;
border-radius:8px;
border:none;
width:200px;
}

/* NAV */
nav{
display:flex;
flex-wrap:wrap;
gap:10px;
justify-content:center;
margin:20px 0;
}

button{
padding:10px 15px;
border:none;
border-radius:10px;
cursor:pointer;
background:linear-gradient(45deg,#ff00cc,#3333ff);
color:white;
font-weight:bold;
transition:0.2s;
}

button:hover{
transform:scale(1.08);
}

/* CARD */
.card{
background:rgba(255,255,255,0.08);
padding:20px;
border-radius:15px;
margin-top:10px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(80px,1fr));
gap:8px;
}

.box{
background:rgba(255,255,255,0.1);
padding:8px;
border-radius:8px;
text-align:center;
}

/* SECTION */
.section{display:none;}
.active{display:block;}

/* TOP BAR */
.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
}

</style>
</head>

<body>

<!-- 🔐 LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <h2>Giriş Yap</h2>

    <input type="text" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Şifre">

    <button onclick="login()">Giriş</button>
    <button onclick="register()">Kayıt Ol</button>
  </div>
</div>

<!-- 🌐 APP -->
<div id="app" style="display:none;">

<div class="container">

<!-- TOP BAR -->
<div class="topbar">
  <div id="userInfo"></div>
  <button onclick="logout()">🚪 Çıkış</button>
</div>

<h1>🔐 Gizli Dil Sistemi PRO</h1>

<nav>
<button onclick="show('home')">Ana</button>
<button onclick="show('translate')">Çeviri</button>
<button onclick="show('alpha')">Alfabe</button>
<button onclick="toggleTheme()">🌗 Tema</button>
</nav>

<!-- HOME -->
<div id="home" class="section active">
<div class="card">
<h2>Hoş Geldin 👋</h2>
<p>Sistem aktif</p>
</div>
</div>

<!-- TRANSLATE -->
<div id="translate" class="section">
<div class="card">
<textarea id="input" placeholder="Yaz..."></textarea>
<div id="output"></div>
</div>
</div>

<!-- ALPHABET -->
<div id="alpha" class="section">
<div class="card grid" id="alphabet"></div>
</div>

</div>
</div>

<script>
/* UI */
function show(id){
document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

function toggleTheme(){
document.body.classList.toggle("light");
}

/* MAP */
const map={
A:"u",E:"o",I:"a",İ:"e",O:"i",Ö:"ö",U:"ü",Ü:"ı",
B:"d",C:"ş",Ç:"t",D:"k",F:"v",G:"b",Ğ:"",
H:"h",J:"y",K:"g",L:"r",M:"n",N:"m",
P:"p",R:"l",S:"z",Ş:"s",T:"ç",V:"f",Y:"c",Z:"j"
};

/* TRANSLATE */
document.getElementById("input").addEventListener("input",(e)=>{
let t=e.target.value.toUpperCase().split("").map(c=>map[c]??c).join("");
document.getElementById("output").innerText=t;
});

/* ALPHABET */
const box=document.getElementById("alphabet");
for(let k in map){
let d=document.createElement("div");
d.className="box";
d.innerText=`${k} → ${map[k]}`;
box.appendChild(d);
}
</script>

<!-- 🔥 FIREBASE (FULL FIX) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { 
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCA5gGIRMDs67LUZ1QrgS7GMNlxC44LsbE",
  authDomain: "servicess-59f58.firebaseapp.com",
  projectId: "servicess-59f58",
  storageBucket: "servicess-59f58.firebasestorage.app",
  messagingSenderId: "898248019243",
  appId: "1:898248019243:web:f57d0190e89df6b68ac96e"
};

const appFirebase = initializeApp(firebaseConfig);
const auth = getAuth(appFirebase);

const loginScreen = document.getElementById("loginScreen");
const appDiv = document.getElementById("app");
const userInfo = document.getElementById("userInfo");

/* REGISTER */
window.register = function(){
let email = document.getElementById("email").value;
let pass = document.getElementById("password").value;

createUserWithEmailAndPassword(auth,email,pass)
.catch(e=>alert(e.message));
}

/* LOGIN */
window.login = function(){
let email = document.getElementById("email").value;
let pass = document.getElementById("password").value;

signInWithEmailAndPassword(auth,email,pass)
.catch(e=>alert(e.message));
}

/* LOGOUT */
window.logout = function(){
signOut(auth);
}

/* 🔥 FIX: GERÇEK KONTROL */
onAuthStateChanged(auth,(user)=>{
if(user){
loginScreen.style.display="none";
appDiv.style.display="block";
userInfo.innerText="👤 "+user.email;
}else{
loginScreen.style.display="flex";
appDiv.style.display="none";
userInfo.innerText="";
}
});
</script>

</body>
</html>
