<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Chat PRO Mobile FIX</title>

<style>
body{
margin:0;
font-family:Arial;
background:radial-gradient(circle,#1a0033,#000);
color:white;
}

#loginScreen{
position:fixed;
inset:0;
background:black;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

.login-box{
background:rgba(255,255,255,0.1);
padding:20px;
border-radius:15px;
text-align:center;
}

input{
display:block;
width:90%;
margin:10px auto;
padding:10px;
border-radius:8px;
border:none;
}

button{
padding:10px;
border:none;
border-radius:10px;
background:linear-gradient(45deg,#ff00cc,#3333ff);
color:white;
width:90%;
margin:5px;
}

.container{
max-width:1000px;
margin:auto;
padding:15px;
}

.panel{
background:rgba(255,255,255,0.08);
padding:10px;
border-radius:10px;
margin-top:10px;
}

.msg{
background:rgba(0,0,0,0.3);
padding:5px;
margin:5px;
border-radius:8px;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">
<div class="login-box">
<h2>Giriş</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Şifre">

<button onclick="login()">GİRİŞ</button>
<button onclick="register()">KAYIT</button>

</div>
</div>

<!-- APP -->
<div id="app" style="display:none;">
<div class="container">

<h2>💬 MOBILE CHAT FIX</h2>
<button onclick="logout()">Çıkış</button>

<div class="panel">
<h3>Chat</h3>
<div id="messages"></div>

<input id="msgInput" placeholder="Mesaj...">
<button onclick="sendMessage()">Gönder</button>
</div>

</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyCA5gGIRMDs67LUZ1QrgS7GMNlxC44LsbE",
  authDomain: "servicess-59f58.firebaseapp.com",
  projectId: "servicess-59f58",
  storageBucket: "servicess-59f58.firebasestorage.app",
  messagingSenderId: "898248019243",
  appId: "1:898248019243:web:f57d0190e89df6b68ac96e"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let currentUser=null;

/* LOGIN */
function login(){
let email=document.getElementById("email").value;
let pass=document.getElementById("password").value;

auth.signInWithEmailAndPassword(email,pass)
.catch(e=>alert(e.message));
}

/* REGISTER */
function register(){
let email=document.getElementById("email").value;
let pass=document.getElementById("password").value;

auth.createUserWithEmailAndPassword(email,pass)
.catch(e=>alert(e.message));
}

/* LOGOUT */
function logout(){
auth.signOut();
}

/* AUTH FIX */
auth.onAuthStateChanged(user=>{
if(user){
currentUser=user;
document.getElementById("loginScreen").style.display="none";
document.getElementById("app").style.display="block";
loadChat();
}else{
document.getElementById("loginScreen").style.display="flex";
document.getElementById("app").style.display="none";
}
});

/* SEND MSG */
function sendMessage(){
let msg=document.getElementById("msgInput").value;
if(!msg) return;

db.collection("messages").add({
text:msg,
user:currentUser.email,
time:Date.now()
});

document.getElementById("msgInput").value="";
}

/* LOAD CHAT */
function loadChat(){
db.collection("messages")
.orderBy("time")
.onSnapshot(snap=>{
let box=document.getElementById("messages");
box.innerHTML="";

snap.forEach(doc=>{
let d=doc.data();
box.innerHTML+=`
<div class="msg">
<b>${d.user}</b><br>${d.text}
</div>`;
});
});
}
</script>

</body>
</html>
