<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Gizli Dil + Chat PRO FIX</title>

<style>
body{
margin:0;
font-family:Arial;
background:radial-gradient(circle,#1a0033,#000);
color:white;
}

body.light{
background:#f5f5f5;
color:black;
}

.container{max-width:1000px;margin:auto;padding:20px;}

#loginScreen{
position:fixed;inset:0;
display:flex;
justify-content:center;
align-items:center;
background:rgba(0,0,0,0.9);
}

.login-box{
background:rgba(255,255,255,0.1);
padding:25px;
border-radius:15px;
text-align:center;
}

input{
display:block;
margin:10px auto;
padding:10px;
width:220px;
}

button{
padding:10px 15px;
border:none;
border-radius:10px;
cursor:pointer;
background:linear-gradient(45deg,#ff00cc,#3333ff);
color:white;
}

.section{display:none;}
.active{display:block;}

#messages{
height:300px;
overflow-y:auto;
background:rgba(0,0,0,0.3);
padding:10px;
border-radius:10px;
margin-bottom:10px;
}
</style>
</head>

<body>

<div id="loginScreen">
<div class="login-box">
<h2>Giriş</h2>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Şifre">
<button onclick="login()">Giriş</button>
<button onclick="register()">Kayıt</button>
</div>
</div>

<div id="app" style="display:none;">
<div class="container">

<h2 id="userInfo"></h2>
<button onclick="logout()">Çıkış</button>

<h1>🔥 Chat PRO FIX</h1>

<div id="messages"></div>

<input id="msgInput" placeholder="Mesaj yaz...">
<button onclick="sendMessage()">Gönder</button>

</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
query,
orderBy,
onSnapshot,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyCA5gGIRMDs67LUZ1QRG7S7GMNlxC44LsbE",
authDomain: "servicess-59f58.firebaseapp.com",
projectId: "servicess-59f58",
storageBucket: "servicess-59f58.appspot.com",
messagingSenderId: "898248019243",
appId: "1:898248019243:web:f57d0190e89df6b68ac96e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.login = () => {
signInWithEmailAndPassword(auth,email.value,password.value)
.catch(e=>alert(e.message));
};

window.register = () => {
createUserWithEmailAndPassword(auth,email.value,password.value)
.catch(e=>alert(e.message));
};

window.logout = () => signOut(auth);

onAuthStateChanged(auth,(user)=>{
if(user){
document.getElementById("loginScreen").style.display="none";
document.getElementById("app").style.display="block";
document.getElementById("userInfo").innerText="👤 "+user.email;
loadMessages();
}else{
document.getElementById("loginScreen").style.display="flex";
document.getElementById("app").style.display="none";
}
});

window.sendMessage = async function(){
const msg = document.getElementById("msgInput");
if(!msg.value.trim()) return;

await addDoc(collection(db,"messages"),{
text:msg.value,
user:auth.currentUser.email,
time:serverTimestamp()
});

msg.value="";
};

function loadMessages(){
const q = query(collection(db,"messages"),orderBy("time"));

onSnapshot(q,(snap)=>{
const box = document.getElementById("messages");
box.innerHTML="";

snap.forEach(doc=>{
let d = doc.data();
let div = document.createElement("div");
div.innerHTML = `<b>${d.user}:</b> ${d.text}`;
box.appendChild(div);
});

box.scrollTop = box.scrollHeight;
});
}
</script>

</body>
</html>
