<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Gizli Dil Sistemi PRO</title>

<style>
body{
margin:0;
font-family:Arial;
background:radial-gradient(circle,#1a0033,#000);
color:white;
transition:0.5s;
}

body.light{
background:#f5f5f5;
color:black;
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

/* LOGIN */
#loginScreen{
position:fixed;
width:100%;height:100%;
background:black;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

.login-box{
background:rgba(255,255,255,0.1);
padding:30px;
border-radius:15px;
backdrop-filter:blur(10px);
text-align:center;
}

.login-box input{
display:block;
margin:10px auto;
padding:10px;
border-radius:8px;
border:none;
}

/* NAV */
nav{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:10px;
margin:20px 0;
}

button{
padding:10px 15px;
border:none;
border-radius:10px;
background:linear-gradient(45deg,#ff00cc,#3333ff);
color:white;
cursor:pointer;
}

button:hover{
transform:scale(1.1);
}

/* CARD */
.card{
background:rgba(255,255,255,0.08);
padding:20px;
border-radius:15px;
margin-top:10px;
}

/* GRID FIX */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(80px,1fr));
gap:8px;
}

.box{
background:rgba(255,255,255,0.1);
padding:8px;
border-radius:8px;
text-align:center;
}

/* SECTIONS */
.section{display:none;}
.active{display:block;}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
font-size:14px;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">
<div class="login-box">
<h2>Giriş</h2>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Şifre">
<button onclick="login()">Giriş</button>
<button onclick="register()">Kayıt</button>
</div>
</div>

<div id="app" style="display:none;">

<div class="container">

<div class="topbar">
<span id="userEmail"></span>
<button onclick="logout()">🚪 Çıkış</button>
</div>

<h1>🔐 Gizli Dil Sistemi PRO</h1>

<nav>
<button onclick="show('home')">Ana</button>
<button onclick="show('translate')">Çeviri</button>
<button onclick="show('alpha')">Alfabe</button>
<button onclick="toggleTheme()">🌗 Tema</button>
</nav>

<div id="home" class="section active">
<div class="card">
<h2>Hoş Geldin</h2>
<p>Gelişmiş sistem aktif 🚀</p>
</div>
</div>

<div id="translate" class="section">
<div class="card">
<textarea id="input" placeholder="Yaz..."></textarea>
<div id="output"></div>
</div>
</div>

<div id="alpha" class="section">
<div class="card grid" id="alphabet"></div>
</div>
</div>

</div>
</div>

<script>
// UI
function show(id){
document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

function toggleTheme(){
document.body.classList.toggle("light");
}

// MAP
const map={
A:"u",E:"o",I:"a",İ:"e",O:"i",Ö:"ö",U:"ü",Ü:"ı",
B:"d",C:"ş",Ç:"t",D:"k",F:"v",G:"b",Ğ:"",
H:"h",J:"y",K:"g",L:"r",M:"n",N:"m",
P:"p",R:"l",S:"z",Ş:"s",T:"ç",V:"f",Y:"c",Z:"j"
};

// TRANSLATE + SAVE
document.getElementById("input").addEventListener("input",(e)=>{
let t=e.target.value.toUpperCase().split("").map(c=>map[c]??c).join("");
document.getElementById("output").innerText=t;
localStorage.setItem("text",e.target.value);
});

// LOAD
window.onload=()=>{
let t=localStorage.getItem("text");
if(t) document.getElementById("input").value=t;
};

// ALPHABET
const box=document.getElementById("alphabet");
for(let k in map){
let d=document.createElement("div");
d.className="box";
d.innerText=`${k} → ${map[k]}`;
box.appendChild(d);
}
</script>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCA5gGIRMDs67LUZ1QrgS7GMNlxC44LsbE",
  authDomain: "servicess-59f58.firebaseapp.com",
  projectId: "servicess-59f58",
  storageBucket: "servicess-59f58.firebasestorage.app",
  messagingSenderId: "898248019243",
  appId: "1:898248019243:web:f57d0190e89df6b68ac96e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.register = ( )=>{
let e=email.value;
let p=password.value;
createUserWithEmailAndPassword(auth,e,p).catch(x=>alert(x.message));
}

window.login = ()=>{
signInWithEmailAndPassword(auth,email.value,password.value)
.catch(x=>alert(x.message));
}

window.logout = ()=>signOut(auth);

onAuthStateChanged(auth,(user)=>{
if(user){
loginScreen.style.display="none";
app.style.display="block";
userEmail.innerText="👤 "+user.email;
}else{
loginScreen.style.display="flex";
app.style.display="none";
}
});
</script>

</body>
</html>
